<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: #0d1f16; color: #eaf2e6;
    font: 14px/1.5 ui-rounded, system-ui, -apple-system, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }
  /* Nothing on this page is a document: no selection, no long-press menu,
     no double-tap zoom, no rubber-band. The stage owns every gesture. */
  body, #mgScrim, #mgScrim canvas {
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Splash. The bundle carries about a megabyte of game; never a blank flash. */
  #cmSplash {
    position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
    align-content: center; gap: 18px; background: #0d1f16;
    transition: opacity .45s ease;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #cmSplash.gone { opacity: 0; pointer-events: none; }
  .cmCrest {
    width: 96px; height: 96px; border-radius: 22px; display: grid; place-items: center;
    background: linear-gradient(160deg, #1b3b26, #15301e);
    border: 3px solid #e9bf63; box-shadow: 0 12px 40px rgba(0,0,0,.5);
    animation: cmFloat 2.6s ease-in-out infinite;
  }
  .cmCrest::after { content: '\1F3C6'; font-size: 44px; }
  .cmName { font: 800 26px/1 ui-rounded, system-ui, sans-serif; color: #e9bf63;
            letter-spacing: .14em; text-align: center; }
  .cmSub { color: #93ab99; font-size: 13px; text-align: center; max-width: 340px;
           padding: 0 20px; }
  .cmBar { width: 180px; height: 5px; border-radius: 3px; background: #1b3b26; overflow: hidden; }
  .cmBar i { display: block; height: 100%; width: 40%; border-radius: 3px; background: #e9bf63;
             animation: cmSlide 1.2s ease-in-out infinite; }
  .cmFine { color: #5d7266; font-size: 11px; text-align: center; max-width: 360px;
            padding: 0 20px; line-height: 1.5; }
  @keyframes cmFloat { 50% { transform: translateY(-8px); } }
  @keyframes cmSlide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { .cmCrest, .cmBar i { animation: none; } }
</style>
</head>
<body>

<div id="cmSplash">
  <div class="cmCrest"></div>
  <div class="cmName">CARD MANAGER</div>
  <div class="cmSub">980 players &middot; 48 nations &middot; seven parallel versions</div>
  <div class="cmBar"><i></i></div>
  <div class="cmFine">Player ratings are sourced from EA’s public FC ratings pages.
    This game is not affiliated with, endorsed by, or licensed by EA.</div>
</div>

<script>
/* Installed-app behaviour: when launched from the home screen, keep the
   screen awake (a manager screen is read, not tapped, and a phone that
   sleeps mid-season is maddening) and take the orientation lock if the
   browser offers one. The shell rotates the board itself either way. */
(function () {
  var standalone = window.navigator.standalone === true
    || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (!standalone) return;
  document.documentElement.classList.add('cm-app');
  addEventListener('DOMContentLoaded', function () {
    if (navigator.wakeLock) {
      var grab = function () {
        navigator.wakeLock.request('screen').catch(function () {});
      };
      grab();
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') grab();
      });
    }
  });
})();
</script>

<!-- SCRIPT ORDER IS LOAD-BEARING
     1. cm-shell.js   defines window.CM_SHELL (and the harness shim)
     2. cm-boot.js    settles the save namespace BEFORE any game code reads it
     3. data          window.MG_DATA
     4. roster        window.MG_ROSTER — the EA FC layer, AFTER MG_DATA
                      (it reads the album merge). Decodes nothing at load.
     5. kits          window.MG_KIT, which the game reads at draw time. This
                      slot used to be mg-portraits.js; the owner's verdict on
                      the procedural faces was "get rid of them and use kits
                      with numbers instead", so the shirt engine ships and the
                      face engine does not. mg-portraits.js stays on disk (the
                      design notes and its contact sheet still point at it) and
                      mg-manager.js no longer calls MG_PORTRAIT anywhere.
     6. the game      registers itself; cm-boot starts it on DOMContentLoaded -->
<script src="cm-shell.js"></script>
<script src="cm-boot.js"></script>
<script src="../gibson/web/static/mg-manager-data.js"></script>
<script src="../gibson/web/static/mg-roster.js"></script>
<script src="../gibson/web/static/mg-kits.js"></script>
<!-- Club badges: one crest per club, embedded as a data URI. The artifact
     viewer blocks external images outright — a linked badge does not load
     slowly there, it never loads and says nothing about why. -->
<script src="../gibson/web/static/mg-badges.js"></script>
<script src="../gibson/web/static/mg-manager.js"></script>
</body>
